services:

  # ---------- Reverse proxy ----------
  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine   # épingle une version précise en prod
    container_name: nginx-proxy
    ports:
      - "80:80"     # nécessaire pour le challenge HTTP-01 de Let's Encrypt
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - pub
    restart: unless-stopped

  # ---------- Certificats Let's Encrypt ----------
  acme-companion:
    image: nginxproxy/acme-companion:latest   # épingle une version précise en prod
    container_name: acme-companion
    depends_on:
      - nginx-proxy
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL}
      # Pour tester sans risquer le rate limit Let's Encrypt (certificat non reconnu) :
      # ACME_CA_URI: https://acme-staging-v02.api.letsencrypt.org/directory
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pub
    restart: unless-stopped

  # ---------- Base de données ----------
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: wiki
      POSTGRES_DB: wiki
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    networks:
      - db
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wiki", "-d", "wiki"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------- Application ----------
  wiki:
    # Pas de "build:" ici : la VM n'a pas le code source, l'image est tirée du registry
    image: headwind565/dumbsumb:1
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wiki
      DB_NAME: wiki
      # Lus par nginx-proxy / acme-companion
      VIRTUAL_HOST: ${WIKI_DOMAIN}
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: ${WIKI_DOMAIN}
    secrets:
      - db_password
    networks:
      - db
      - pub
    # Plus de "ports:" : le wiki n'est joignable que via le proxy en HTTPS
    healthcheck:
      interval: 30s
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    command:
      - sh
      - -c
      - export DB_PASS="$$(cat /run/secrets/db_password)" && exec node --no-experimental-webstorage backend

secrets:
  db_password:
    file: ./secrets/db_password.txt   # écrit par Terraform/cloud-init

volumes:
  db-data:
  certs:
  vhost:
  html:
  acme:

networks:
  db:
    internal: true  
  pub:               
