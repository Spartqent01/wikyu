services:

  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.11.6-alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks: [pub]
    restart: unless-stopped

  acme-companion:
    image: nginxproxy/acme-companion:2.8.2
    container_name: acme-companion
    depends_on: [nginx-proxy]
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [pub]
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: wiki
      POSTGRES_DB: wiki
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db-data:/var/lib/postgresql
    networks: [db]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wiki", "-d", "wiki"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  wiki:
    image: headwind565/dumbsumb:1
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wiki
      DB_NAME: wiki
      VIRTUAL_HOST: ${WIKI_DOMAIN}
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: ${WIKI_DOMAIN}
    secrets: [db_password]
    networks: [db, pub]
    command: sh -c 'export DB_PASS="$$(cat /run/secrets/db_password)" && exec node --no-experimental-webstorage backend'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  db-data:
  certs:
  vhost:
  html:
  acme:

networks:
  db:
    internal: true
  pub:
